[daemon]
interval_secs = 1800    # how often to rotate wallpapers, in seconds (1800 = 30 min)
change_on_login = true  # change wallpaper when you log in
change_on_unlock = true # change wallpaper when you unlock your screen
# on_change = "wallust run %w"  # run after every wallpaper change (%w = wallpaper path)
# on_start  = "wallust run %w"  # run once at daemon start (%w = last wallpaper from history)
# on_error  = "notify-send -u critical 'hinhnen' '%e'"  # run on source/setter failure (%e = error)

[setter]
# wallpapers are applied with awww. hinhnen starts awww-daemon for you if it isn't running.
transition = "fade"        # none | simple | fade | left | right | top | bottom | wipe | wave | grow | center | any | outer | random
transition_duration = 1.5  # transition length in seconds

[sources]
rotation = "weighted_random"  # weighted_random | round_robin

# mixing local and remote sources is not supported - use one type only.
# local-only: `hinhnen next` cycles through history. remote-only: fetches a new image.

[[sources.list]]
type = "bing"
weight = 1

# [[sources.list]]
# type = "local"
# path = "~/Pictures/Wallpapers"
# order = "random"   # random | sequential
# weight = 1

# [[sources.list]]
# type = "unsplash"
# api_key = "your_api_key_here"
# query = "nature"          # optional
# orientation = "landscape" # optional - landscape | portrait | squarish
# weight = 1

# [[sources.list]]
# type = "nasa_apod"
# api_key = "your_api_key_here"
# weight = 1

# [[sources.list]]
# type = "wallhaven"
# api_key = "your_api_key_here"  # optional - only needed for NSFW purity
# query = "landscape"            # optional - search terms
# categories = "111"             # optional - general/anime/people as on/off bits
# purity = "100"                 # optional - sfw/sketchy/nsfw as on/off bits
# weight = 1

[cache]
max_size_mb = 500              # max disk space for cached images, in MB
history_size = 100             # how many past wallpapers to remember
dir = "~/.cache/hinhnen/images"  # where to store downloaded images
